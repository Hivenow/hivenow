name: Build Hive Seller Android APK

on:
  workflow_dispatch:
  push:
    branches:
      - main
    paths:
      - 'apps/boutique/**'
      - '.github/workflows/build-seller-apk.yml'

jobs:
  build-apk:
    name: Build Android APK
    runs-on: ubuntu-latest
    permissions:
      contents: write

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up JDK 21
        uses: actions/setup-java@v4
        with:
          java-version: '21'
          distribution: 'temurin'

      - name: Set up Android SDK
        uses: android-actions/setup-android@v3

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: 'npm'

      - name: Install monorepo dependencies
        run: npm install --legacy-peer-deps

      - name: Capacitor sync (generate Android native deps)
        run: |
          cd apps/boutique
          mkdir -p public
          echo '<!-- placeholder -->' > public/index.html
          npx cap sync android --inline

      - name: Setup Gradle
        uses: gradle/actions/setup-gradle@v4

      - name: Build Android APK
        run: |
          cd apps/boutique/android
          chmod +x gradlew
          ./gradlew assembleDebug --stacktrace

      - name: Upload APK Artifact
        uses: actions/upload-artifact@v4
        with:
          name: hive-seller-debug
          path: apps/boutique/android/app/build/outputs/apk/debug/app-debug.apk

      - name: Create GitHub Release with APK
        if: github.event_name == 'push'
        uses: softprops/action-gh-release@v2
        with:
          tag_name: seller-v${{ github.run_number }}
          name: Hive Partners v1.1 (Build ${{ github.run_number }})
          body: |
            🐝 **Hive Partners Android APK**
            
            Download and install on any Android device.
            Built from commit ${{ github.sha }}.
          files: apps/boutique/android/app/build/outputs/apk/debug/app-debug.apk
          token: ${{ secrets.GITHUB_TOKEN }}

      - name: Copy APK for latest release
        if: github.event_name == 'push'
        run: cp apps/boutique/android/app/build/outputs/apk/debug/app-debug.apk apps/boutique/android/app/build/outputs/apk/debug/hive-partners.apk

      - name: Update latest release
        if: github.event_name == 'push'
        uses: softprops/action-gh-release@v2
        with:
          tag_name: latest
          name: Hive Partners — Latest
          body: |
            🐝 **Always up-to-date Hive Partners APK**
            
            Download: [hive-partners.apk](https://github.com/Hivenow/hivenow/releases/latest/download/hive-partners.apk)
          files: apps/boutique/android/app/build/outputs/apk/debug/hive-partners.apk
          prerelease: false
          make_latest: true
          token: ${{ secrets.GITHUB_TOKEN }}




