name: CI

# Quality gate for pull requests and pushes to main.
#
# Before this existed the only workflow in the repository built an Android APK,
# and the customer app's next.config actively suppressed TypeScript and ESLint
# failures — so nothing anywhere checked types, lint or tests before a deploy.
#
# Jobs are deliberately separate rather than chained: a lint failure and a type
# failure are different problems, and seeing both in one run is more useful than
# stopping at the first.

on:
  pull_request:
    branches: [main]
  push:
    branches: [main]

# A new push to the same branch cancels the previous run.
concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

env:
  # Convex codegen output is committed, so no deployment credentials are needed
  # to typecheck. This placeholder only satisfies modules that read the variable
  # at import time; it is not a secret and points nowhere.
  NEXT_PUBLIC_CONVEX_URL: https://placeholder.convex.cloud

jobs:
  typecheck:
    name: Typecheck
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        workspace:
          - convex
          - apps/boutique
          - apps/customer
          - apps/admin
          - apps/mobile
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - name: Install dependencies
        run: npm ci --legacy-peer-deps

      - name: tsc --noEmit (${{ matrix.workspace }})
        working-directory: ${{ matrix.workspace }}
        run: npx tsc --noEmit

  lint:
    name: Lint
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        app: [customer, admin, boutique]
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - name: Install dependencies
        run: npm ci --legacy-peer-deps

      # --quiet reports errors only. Warnings are surfaced locally but do not
      # gate: the repository had no lint configuration at all until now, so
      # every pre-existing style finding would otherwise block every pull
      # request. Tighten by lowering rules from "warn" to "error" in
      # eslint.config.mjs as areas are cleaned up.
      - name: eslint (${{ matrix.app }})
        working-directory: apps/${{ matrix.app }}
        run: npx eslint . --quiet

  test:
    name: Tests
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - name: Install dependencies
        run: npm ci --legacy-peer-deps

      # Signature, payout-hold, coupon, exchange-flow and boutique-hours suites.
      - name: npm test
        run: npm test
